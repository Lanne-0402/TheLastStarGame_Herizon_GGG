<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE LAST STAR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="450" height="800"></canvas>

    <div id="edge-warning-overlay"></div>
    
    <!-- HUD Layer -->
    <div id="hud">
      <div class="hud-top-row">
        <div class="hud-item"><span id="heart-counter">❤️❤️❤️</span></div>
        <div class="hud-item star-pill">KÝ ỨC: <span id="star-counter">0/3</span> ⭐</div>
        <div class="hud-item">ĐIỂM: <span id="score-counter">0</span></div>
      </div>
      <div class="hud-bottom-row">
        <span id="level-title">MAP 1: NGOẠI Ô</span>
        <span>TẦNG: <span id="floor-counter">0</span>/<span id="target-counter">15</span></span>
      </div>
    </div>


    <!-- Phản hồi chất lượng thả khối -->
    <div id="combo-feedback"></div>

    <!-- 1. MÀN HÌNH CHẠM ĐỂ BẮT ĐẦU (Giải quyết Autoplay Policy của trình duyệt) -->
    <div id="start-screen" class="modal-overlay">
      <div class="start-box">
        <div class="start-star-art">⭐</div>
        <h1 class="game-logo">THE LAST STAR</h1>
        <p class="game-tagline">Ánh sáng phục vụ con người nhưng không che khuất những vì sao</p>
        <button id="btn-start-game" class="btn-pulse">BẮT ĐẦU HÀNH TRÌNH</button>
      </div>
    </div>

    <!-- 2. POPUP KÝ ỨC GIỮA CÁC MAP (Mở khi đủ 3/3 sao Map 1 & Map 2) -->
    <div id="memory-modal" class="modal-overlay hidden">
      <div class="memory-card">
        <div class="memory-image-holder">
          <img id="memory-img" class="hidden" alt="Ký ức">
          <div id="memory-fallback" class="memory-fallback-icon">🌌</div>
        </div>
        <h3 id="memory-title">KÝ ỨC VỀ BẦU TRỜI</h3>
        <p id="memory-desc">Mô tả ký ức...</p>
        <button id="btn-close-memory" class="btn-action primary">TIẾP TỤC HÀNH TRÌNH</button>
      </div>
    </div>

    <!-- 3. MÀN HÌNH TỔNG KẾT HẾT MAP -->
    <div id="level-end-modal" class="modal-overlay hidden">
      <div class="end-summary-box">
        <h2 id="end-title">HOÀN THÀNH BẢN ĐỒ!</h2>
        <div class="end-stars" id="end-stars-display">⭐⭐⭐</div>
        <p id="end-score-info">Điểm kỹ năng: 120</p>
        <p id="end-memory-status" class="memory-hint">Thu đủ 3/3 sao để mở Ký Ức!</p>
        <div class="end-actions">
          <button id="btn-replay-map" class="btn-action">CHƠI LẠI (TÌM ĐỦ SAO)</button>
          <button id="btn-next-map" class="btn-action primary">SANG MÀN TIẾP</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
