<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Last STAR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    
    <!-- 1. LOADING PAGE (image_a87cf4.png) -->
    <div id="screen-loading" class="screen">
      <div class="logo-box">
        <h1 class="logo-text">The <span class="logo-accent">Last</span></h1>
        <div class="logo-star-row">
          <span>ST</span><span class="star-icon">⭐</span><span>R</span>
        </div>
      </div>
      <div class="loading-label">Loading..</div>
    </div>

    <!-- 2. MAIN MENU CAROUSEL (image_a87d35.png) -->
    <div id="screen-menu" class="screen hidden">
      <button id="btn-open-setting" class="icon-btn-setting" title="Cài đặt">⚙️</button>
      
      <!-- Carousel 3 Map -->
      <div id="map-carousel" class="carousel">
        <div class="carousel-track" id="carousel-track">
          <!-- Slide Map 1 -->
          <div class="carousel-slide" data-level="1">
            <div class="slide-content">
              <div class="menu-logo-wrap">
                <h2 class="menu-logo-sub">THE</h2>
                <div class="menu-logo-main">ST<span class="star-mini">⭐</span>R</div>
              </div>
              <button class="btn-play" data-level="1">Play</button>
            </div>
          </div>
          <!-- Slide Map 2 -->
          <div class="carousel-slide locked" data-level="2">
            <div class="slide-content">
              <div class="menu-logo-wrap">
                <h2 class="menu-logo-sub">THE</h2>
                <div class="menu-logo-main">ST<span class="star-mini">⭐</span>R</div>
              </div>
              <button class="btn-play btn-disabled" data-level="2">Play</button>
            </div>
          </div>
          <!-- Slide Map 3 -->
          <div class="carousel-slide locked" data-level="3">
            <div class="slide-content">
              <div class="menu-logo-wrap">
                <h2 class="menu-logo-sub">THE</h2>
                <div class="menu-logo-main">ST<span class="star-mini">⭐</span>R</div>
              </div>
              <button class="btn-play btn-disabled" data-level="3">Play</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Indicators Dots -->
      <div class="carousel-dots">
        <span class="dot active" data-index="0"></span>
        <span class="dot" data-index="1"></span>
        <span class="dot" data-index="2"></span>
      </div>
    </div>

    <!-- 3. GAMEPLAY CANVAS -->
    <canvas id="gameCanvas" width="450" height="800"></canvas>

    <!-- IN-GAME HUD -->
    <div id="game-hud" class="hud-layer hidden">
      <div class="hud-top">
        <div class="hud-badge">TẦNG: <span id="floor-counter">0</span>/<span id="target-counter">15</span></div>
        <div class="hud-badge">ĐIỂM: <span id="score-counter">0</span></div>
        <div class="hud-badge"><span id="star-tracker">⭐ 0/3</span></div>
        <div class="hud-badge"><span id="heart-counter">❤️❤️❤️</span></div>
        <button id="btn-ingame-setting" class="hud-setting-btn">⚙️</button>
      </div>
      
      <!-- Feedback thông báo (HOÀN HẢO, RẤT TỐT, ...) -->
      <div id="combo-feedback"></div>
    </div>

    <!-- 4. POPUP SETTING (image_a87d54.png) -->
    <div id="popup-setting" class="modal-overlay hidden">
      <div class="panel-card panel-parchment">
        <div class="panel-ribbon ribbon-red">Setting</div>
        <div class="setting-audio-row">
          <button id="btn-toggle-music" class="btn-bubble btn-music" title="Nhạc nền"></button>
          <button id="btn-toggle-sound" class="btn-bubble btn-sound" title="Hiệu ứng"></button>
        </div>
        <div class="panel-menu-list">
          <button id="btn-setting-resume" class="btn-bubble btn-block">resume</button>
          <button id="btn-setting-support" class="btn-bubble btn-block">support</button>
          <button id="btn-setting-exit" class="btn-bubble btn-block">exit</button>
        </div>
      </div>
    </div>

    <!-- 5. POPUP COMPLETE (image_a88022.png) -->
    <div id="popup-complete" class="modal-overlay hidden">
      <div class="panel-card panel-parchment">
        <div class="panel-ribbon ribbon-red">Complete</div>
        <div class="star-rating-row" id="complete-stars">
          <span class="star-slot empty"></span>
          <span class="star-slot empty big"></span>
          <span class="star-slot empty"></span>
        </div>
        <div class="score-display-box">
          <div class="score-title">Score</div>
          <div class="score-value" id="complete-score">0</div>
        </div>
        
        <!-- Thông báo điều kiện Rank S & Thu thập Sao -->
        <div id="complete-rank-badge" class="rank-badge">RANK S</div>
        <div id="complete-notice" class="complete-notice"></div>

        <div class="panel-actions-row">
          <button id="btn-complete-home" class="btn-action-bubble btn-home" title="Trang chủ"></button>
          <button id="btn-complete-retry" class="btn-action-bubble btn-retry" title="Chơi lại"></button>
          <button id="btn-complete-next" class="btn-action-bubble btn-next" title="Màn tiếp theo"></button>
        </div>
      </div>
    </div>

    <!-- 6. POPUP FAILED (image_a8805b.png) -->
    <div id="popup-failed" class="modal-overlay hidden">
      <div class="panel-card panel-parchment">
        <div class="panel-ribbon ribbon-red">Failed</div>
        <div class="star-rating-row">
          <span class="star-slot empty">★</span>
          <span class="star-slot empty big">★</span>
          <span class="star-slot empty">★</span>
        </div>
        <div class="score-display-box">
          <div class="score-title">Score</div>
          <div class="score-value" id="failed-score">0</div>
        </div>
        <div class="panel-actions-row">
          <button id="btn-failed-home" class="btn-action-bubble btn-home" title="Trang chủ"></button>
          <button id="btn-failed-retry" class="btn-action-bubble btn-retry" title="Chơi lại"></button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
